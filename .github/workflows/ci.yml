name: Pull Request CI

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auth-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DB_URL: jdbc:h2:mem:auth-ci;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
      DB_USERNAME: sa
      DB_PASSWORD: ""
      JWT_SECRET: ci-test-key-0123456789-ABCDEFGHIJKLMNOPQRSTUVWXYZ-abcdefghijklmnopqrstuvwxyz
      JWT_ISSUER: payroll-auth
      JWT_AUDIENCE: payroll-publisher
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Java 21
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Clean build and tests
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Require test reports and package
        run: |
          test -n "$(find target/surefire-reports -type f -name 'TEST-*.xml' -print -quit)"
          test -n "$(find target -maxdepth 1 -type f -name '*.jar' -print -quit)"

  required:
    name: CI / required
    if: always()
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - name: Require every validation gate
        run: test "${{ needs.validate.result }}" = success
